# Build and test Foliolum on our Linux runner: DesignCraft at the pin with our patches, the workspace
# tests, the Phase 1 gate's machine checks on the public pubsmith and dev22 sets, and the web build.
#
# This repo is public and the runner is ours, so (house rule for public repos on self-hosted runners):
#   - no pull_request trigger at all: fork code never reaches the runner;
#   - push runs on main only (Dependabot branches never start CI);
#   - every job runs only when the repository owner started it.
# To check a PR branch before merging: gh workflow run ci.yml --ref <branch>
#
# The runner (doodlemanage-foliolum, label tdp-linux) and how the toolchain is installed and cached:
# .github/actions/rust-toolchain.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-test:
    name: Build and test
    if: github.actor == github.repository_owner
    runs-on: ${{ vars.RUNNER_LINUX || 'tdp-linux' }}
    # A cold runner (no toolchain, empty cache) needs about two hours; a warm one far less.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-toolchain

      - name: DesignCraft at the pin, our patches, bundled fonts
        run: fork/fetch.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Gate fixtures (pubsmith, dev22 and Pubwork's reader, pinned)
        run: gate/fetch-fixtures.sh

      - name: Node for the Pubwork reader
        # The gate's second reference runs under Node (gate/pubwork/oracle.mjs), and the runner's own
        # Node is too old for ES modules. A pinned build, checked and kept under $HOME between runs.
        env:
          NODE_VERSION: v22.23.4
          NODE_SHA256: b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406
        run: |
          set -euo pipefail
          dir="$HOME/.cache/node-$NODE_VERSION"
          if [[ ! -x "$dir/bin/node" ]]; then
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 -o "$tmp/node.tar.gz" "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.gz"
            echo "$NODE_SHA256  $tmp/node.tar.gz" | sha256sum -c -
            mkdir -p "$dir"
            tar -xzf "$tmp/node.tar.gz" -C "$dir" --strip-components 1
            rm -rf "$tmp"
          fi
          "$dir/bin/node" --version
          echo "FOLIOLUM_NODE=$dir/bin/node" >> "$GITHUB_ENV"

      - name: Tests
        # After the fixtures and Node: one gate test runs Pubwork's reader.
        run: cargo test --workspace

      - name: Gate machine checks, pubsmith (opens, complete, exports)
        # Every pubsmith file must open, match Publisher's layout export and export a print PDF. The
        # reviewer's verdict isn't a machine check, so --no-review.
        run: cargo xtask gate --set pubsmith --names --no-review fixtures/pubsmith

      - name: Gate machine checks, dev22 (against Pubwork's reader)
        # These files have no layout export, so completeness is checked against Pubwork's reader. The
        # three Publisher 97-2000 files are left out: foliolum-pub refuses them by design.
        run: |
          set -euo pipefail
          files=()
          for f in fixtures/dev22/*.pub; do
            case "$(basename "$f")" in poi-Sample98.pub|poi-Sample2000.pub|lo-fdo59355-1.pub) ;; *) files+=("$f") ;; esac
          done
          [[ ${#files[@]} -eq 19 ]] || { echo "expected 19 files, found ${#files[@]}" >&2; exit 1; }
          cargo xtask gate --set dev22 --names --no-review "${files[@]}"

      - name: Clippy (web)
        run: cargo clippy -p foliolum-web --target wasm32-unknown-unknown -- -D warnings

      - name: Web build
        # Proves the web app builds. The size-tuned build (fat LTO, one codegen unit, then wasm-opt)
        # takes about 6 minutes on m4 but over an hour on this runner at 2 CPUs, and only the deploy needs
        # it (deploy.yml). So CI builds the same `web` profile without LTO, and as a non-release trunk
        # build, which skips wasm-opt (20 minutes here).
        working-directory: apps/foliolum-web
        env:
          CARGO_PROFILE_WEB_LTO: "off"
          CARGO_PROFILE_WEB_CODEGEN_UNITS: "16"
        run: |
          trunk build --release false
          ls -l ../../dist/web/*.wasm
