# Build and test Foliolum on our Linux runner: DesignCraft at the pin with our patches, the workspace
# tests, the Phase 1 gate's machine checks on the public pubsmith set, and the web build.
#
# This repo is public and the runner is ours, so (house rule for public repos on self-hosted runners):
#   - no pull_request trigger at all: fork code never reaches the runner;
#   - push runs on main only (Dependabot branches never start CI);
#   - every job runs only when the repository owner started it.
# To check a PR branch before merging: gh workflow run ci.yml --ref <branch>
#
# The runner (doodlemanage-foliolum, label tdp-linux) is a persistent Ubuntu container with Node and
# little else, running as root. The job installs the few Debian packages it needs when they are
# missing, and the Rust toolchain rust-toolchain.toml pins, under $HOME (trunk's own tools are pinned
# in Trunk.toml). Cargo's home and the target directory live under $HOME too, outside the checkout, so
# they survive between runs (checkout cleans the workspace) and act as the cache; a recreated runner
# just starts cold.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_VERSION: "1.29.3"
  RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
  TRUNK_VERSION: "0.22.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-test:
    name: Build and test
    if: github.actor == github.repository_owner
    runs-on: ${{ vars.RUNNER_LINUX || 'tdp-linux' }}
    # A cold runner (no toolchain, empty cache) needs about two hours; a warm one far less.
    timeout-minutes: 180
    steps:
      - name: Debian packages (only those missing)
        shell: bash
        run: |
          set -euo pipefail
          # build-essential: ring's build script and the linker; pkg-config and libwayland-dev:
          # DesignCraft's window crate (wayland-sys). git and curl: the fetch scripts.
          pkgs=(build-essential pkg-config libwayland-dev git curl ca-certificates)
          missing=()
          for p in "${pkgs[@]}"; do dpkg -s "$p" >/dev/null 2>&1 || missing+=("$p"); done
          if ((${#missing[@]})); then
            echo "installing: ${missing[*]}"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends "${missing[@]}"
          else
            echo "all present"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (rust-toolchain.toml) and trunk
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "CARGO_TARGET_DIR=$HOME/.cache/foliolum-target"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null; then
            tmp="$(mktemp -d)"
            curl -fsSL --retry 3 -o "$tmp/rustup-init" \
              "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
            echo "${RUSTUP_INIT_SHA256}  $tmp/rustup-init" | sha256sum -c -
            chmod +x "$tmp/rustup-init"
            "$tmp/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
            rm -rf "$tmp"
          fi
          # Installs the channel, components and target rust-toolchain.toml names.
          rustup toolchain install
          if [[ "$(trunk -V 2>/dev/null || true)" != "trunk $TRUNK_VERSION" ]]; then
            cargo install trunk --version "$TRUNK_VERSION" --locked
          fi
          rustc -V; cargo -V; trunk -V

      - name: DesignCraft at the pin, our patches, bundled fonts
        run: fork/fetch.sh

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Gate fixtures (pubsmith, pinned)
        run: gate/fetch-fixtures.sh

      - name: Gate machine checks (opens, complete, exports)
        # Every pubsmith file must open, match Publisher's layout export and export a print PDF. The
        # reviewer's verdict isn't a machine check, so --no-review.
        run: cargo xtask gate --set pubsmith --names --no-review fixtures/pubsmith

      - name: Clippy (web)
        run: cargo clippy -p foliolum-web --target wasm32-unknown-unknown -- -D warnings

      - name: Web build
        # Proves the web app builds. The size-tuned profile's fat LTO with one codegen unit takes
        # about 3 minutes on m4 but ran past 23 on this 2-CPU runner, so CI builds the same profile
        # without LTO (about the same time as the rest of the build). The deploy build keeps it.
        working-directory: apps/foliolum-web
        env:
          CARGO_PROFILE_WEB_LTO: "off"
          CARGO_PROFILE_WEB_CODEGEN_UNITS: "16"
        run: |
          trunk build
          ls -l ../../dist/web/*.wasm
