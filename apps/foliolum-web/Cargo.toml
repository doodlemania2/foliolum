[package]
name = "foliolum-web"
description = "Foliolum in the browser: DesignCraft's editor with Publisher file import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "foliolum-web"
path = "src/main.rs"

[dependencies]
foliolum-pub = { workspace = true }
foliolum-fonts = { workspace = true }
designcraft-engine = { workspace = true }
designcraft-fonts = { workspace = true }
designcraft-format = { workspace = true }
designcraft-ui-egui = { workspace = true }
egui = { workspace = true }
form_urlencoded = "1.2"
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Same features as DesignCraft's web app: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
foliolum-shell = { workspace = true }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Event", "EventTarget", "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration"] }
