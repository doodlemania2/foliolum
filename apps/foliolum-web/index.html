<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foliolum</title>
  <link data-trunk rel="rust" data-bin="foliolum-web" data-wasm-opt="z" data-weak-refs data-cargo-profile="web" />
  <!-- The bundled fonts, fetched after start (src/fonts_web.rs), with their licences. -->
  <link data-trunk rel="copy-dir" href="../../crates/foliolum-fonts/web" data-target-path="fonts" />
  <!-- Foliolum's mark; favicon.ico is rendered from the SVG by `cargo xtask favicon`. Copied under fixed
       names, because browsers ask for /favicon.ico on their own. -->
  <link data-trunk rel="copy-file" href="favicon.svg" />
  <link data-trunk rel="copy-file" href="favicon.ico" />
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #foliolum_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #foliolum_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; gap: 6px; }
    #foliolum_loading small { color: #8a8a8a; }
  </style>
</head>
<body>
  <canvas id="foliolum_canvas"></canvas>
  <div id="foliolum_loading">Loading Foliolum&hellip;<small>Based on DesignCraft by the ArtCraft team</small></div>
</body>
</html>
