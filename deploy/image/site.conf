# app.foliolum.app. The public-fleet cloudflared reaches this on 127.0.0.1:18117 (doodlessd) and
# sends the visitor's Host header. Cloudflare ends TLS.
#
# Static files only: the editor opens and exports documents in the browser, so nothing is uploaded
# and nothing is stored here.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  absolute_redirect off;

  # prepare.sh writes a .gz beside every large file; nginx sends it to a browser that accepts gzip.
  gzip_static on;

  types {
    text/html html;
    text/javascript js;
    application/wasm wasm;
    text/plain txt;
  }
  default_type application/octet-stream;
  charset_types text/javascript text/plain;

  include /etc/nginx/conf.d/headers.inc;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The page names the hashed files, so it must never be cached stale.
  location = /index.html {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
  }
  location = / {
    try_files /index.html =404;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache" always;
  }

  # Everything else is named by its content hash (trunk's filehash), so it never changes.
  location / {
    try_files $uri =404;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
