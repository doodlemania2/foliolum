# app.foliolum.app. The public-fleet cloudflared reaches this on 127.0.0.1:18117 (doodlessd) and
# sends the visitor's Host header. Cloudflare ends TLS.
#
# The editor's files, plus /api/ passed to the backend (services/foliolum-api) in the same stack.
# Documents are opened and exported in the browser; only what a person shares with their parish
# (templates) or asks to proofread goes to the backend.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  absolute_redirect off;

  # prepare.sh writes a .gz beside every large file; nginx sends it to a browser that accepts gzip.
  gzip_static on;

  types {
    text/html html;
    text/javascript js;
    application/wasm wasm;
    font/ttf ttf;
    image/svg+xml svg;
    image/x-icon ico;
    text/plain txt;
  }
  default_type application/octet-stream;
  charset_types text/javascript text/plain;

  include /etc/nginx/conf.d/headers.inc;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The page names the hashed files, so it must never be cached stale. no-transform stops Cloudflare
  # injecting its Web Analytics beacon, which the CSP would block (the zone's analytics rule covers
  # every host, and the zone cannot hold an exception for this one).
  location = /index.html {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
  }
  location = / {
    try_files /index.html =404;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
  }

  # TDPdf Sign returns the sign-in popup to /sign/callback (apps/foliolum-web/sign/). Its files keep
  # fixed names, so they are revalidated rather than cached for good.
  location = /sign/callback {
    try_files /sign/callback.html =404;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
  }
  # Claviger returns the sign-in popup to /auth/callback (apps/foliolum-web/auth/).
  location = /auth/callback {
    try_files /auth/callback.html =404;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
  }
  location ^~ /sign/ {
    try_files $uri @missing;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
  }

  # The backend, same-origin, so the CSP needs no new source for it. Its address is looked up at
  # request time (Docker's resolver), so the editor starts and serves while the backend is down.
  location ^~ /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://foliolum-api:8081;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 95s;
    proxy_buffering off;
    # A shared template is up to 8 MB, base64 in JSON.
    client_max_body_size 12m;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-store" always;
  }

  # The icons keep fixed names (browsers ask for /favicon.ico unprompted), so they are cached for a
  # day, not for good.
  location ~ ^/favicon\.(ico|svg)$ {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=86400" always;
  }

  # Everything else is named by its content hash (trunk's filehash), so it never changes. Only a file
  # that is there gets the long cache: a 404 must not be kept, or a file added later stays missing at
  # Cloudflare (/favicon.ico did, #29).
  location / {
    try_files $uri @missing;
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location @missing {
    include /etc/nginx/conf.d/headers.inc;
    add_header Cache-Control "no-store" always;
    return 404;
  }
}
